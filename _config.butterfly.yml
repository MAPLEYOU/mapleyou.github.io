# Butterfly 主题配置覆盖
# 完整配置参考: https://butterfly.js.org/

# 顶部导航菜单 (注意: menu 是顶层配置)
menu:
  首页: / || fas fa-home
  专栏: /courses/ || fas fa-book-open
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  GitHub: https://github.com/MAPLEYOU || fab fa-github
  关于: /about/ || fas fa-user

nav:
  logo:
  display_title: true
  fixed: false

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  custom_text: '<a href="https://github.com/MAPLEYOU/mapleyou.github.io" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub 订阅本站</a>'

# 页面顶部横幅风景图 (Pexels 免费图库)
# 首页全屏 banner
index_img: /img/banner/mountain-2.jpg
# 其余页面默认 (含文章页/自定义页)
default_top_img: /img/banner/mountain-1.jpg
# 归档页
archive_img: /img/banner/forest-1.jpg
# 标签页
tag_img: /img/banner/coast-2.jpg
# 分类页
category_img: /img/banner/coast-1.jpg

# 全站注入
inject:
  head:
    - <link rel="stylesheet" href="/css/course.css">

# 侧边栏社交图标
favicon: /img/favicon.png

social:
  fab fa-github: https://github.com/MAPLEYOU || GitHub
  fas fa-rss: /atom.xml || RSS 订阅

# 首页文章封面: 没写 cover 的文章不显示封面图, 首页更干净
index:
  cover:
    default_cover:

# 文章页
post:
  cover:
    default_cover:
  meta:
    date: true
    updated: false
    tags: true
    categories: true

# 侧边栏
aside:
  enable: true
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description:
      - ISP / 相机影像 / 开发随笔
    button:
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/MAPLEYOU
  card_announcement:
    enable: false
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 20
    color: false
  card_archives:
    enable: false
  card_webinfo:
    enable: false

# 评论: giscus（基于 GitHub Discussions，数据在本仓库）
comments:
  use: giscus
  text: true
  lazyload: true

giscus:
  repo: MAPLEYOU/mapleyou.github.io
  repo_id: R_kgDOU5mdwQ
  category_id: DIC_kwDOU5mdwc4DG_qz
  light_theme: light
  dark_theme: dark

# 访问统计: 不蒜子
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true
